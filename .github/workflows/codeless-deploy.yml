name: Garcar Production Deploy

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Deploy <registered-repo> to <staging|production>'
        required: true
        type: string
      confirm_production:
        description: 'Type DEPLOY-PRODUCTION for a production deployment'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: garcar-deploy-${{ inputs.command }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.parse.outputs.repo }}
      env: ${{ steps.parse.outputs.env }}
      platform: ${{ steps.parse.outputs.platform }}
      project_id: ${{ steps.parse.outputs.project_id }}
      service_id: ${{ steps.parse.outputs.service_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Validate command and registry
        id: parse
        run: node engine/orchestrator.js "${{ inputs.command }}"
      - name: Require explicit production confirmation
        if: steps.parse.outputs.env == 'production' && inputs.confirm_production != 'DEPLOY-PRODUCTION'
        run: |
          echo 'Production requires confirm_production=DEPLOY-PRODUCTION.'
          exit 1

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.validate.outputs.env }}
    steps:
      - name: Checkout deployment engine
        uses: actions/checkout@v4

      - name: Checkout target repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh repo clone "Garrettc123/${{ needs.validate.outputs.repo }}" target-repo

      - name: Install pinned deployment CLIs
        run: |
          set -euo pipefail
          npm install --global @railway/cli@4 vercel@48

      - name: Deploy to Railway
        if: needs.validate.outputs.platform == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ needs.validate.outputs.project_id }}
          SERVICE_ID: ${{ needs.validate.outputs.service_id }}
          TARGET_ENV: ${{ needs.validate.outputs.env }}
        run: |
          set -euo pipefail
          test -n "$RAILWAY_TOKEN"
          test -n "$PROJECT_ID"
          test -n "$SERVICE_ID"
          cd target-repo
          railway link "$PROJECT_ID"
          railway up --service "$SERVICE_ID" --environment "$TARGET_ENV" --detach

      - name: Deploy to Vercel
        if: needs.validate.outputs.platform == 'vercel'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET_ENV: ${{ needs.validate.outputs.env }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          cd target-repo
          if [ "$TARGET_ENV" = 'production' ]; then
            vercel deploy --prod --token "$VERCEL_TOKEN" --yes
          else
            vercel deploy --token "$VERCEL_TOKEN" --yes
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "Repository: ${{ needs.validate.outputs.repo }}"
          echo "Environment: ${{ needs.validate.outputs.env }}"
          echo "Platform: ${{ needs.validate.outputs.platform }}"
          echo "Result: ${{ job.status }}"
