name: 🚀 Garcar Codeless Deploy Engine

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Plain English deploy command'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Engine
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Parse Command via Orchestrator
        id: parse
        run: node engine/orchestrator.js "${{ github.event.inputs.command }}"
      
      - name: Clone Target Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "→ Cloning target repository: ${{ steps.parse.outputs.repo }}"
          gh repo clone Garrettc123/${{ steps.parse.outputs.repo }} target-repo
          
      - name: Install Deployment CLIs
        run: npm install -g @railway/cli vercel

      - name: Execute Railway Deploy
        if: steps.parse.outputs.platform == 'railway'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🚀 Deploying to Railway: ${{ steps.parse.outputs.env }}"
          cd target-repo
          
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "❌ RAILWAY_TOKEN missing."
            exit 1
          fi
          
          # Link and deploy using specific Service ID
          railway link ${{ steps.parse.outputs.project_id }}
          railway up --service ${{ steps.parse.outputs.service_id }} --environment ${{ steps.parse.outputs.env }} --detach

      - name: Execute Vercel Deploy
        if: steps.parse.outputs.platform == 'vercel'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.parse.outputs.project_id }}
        run: |
          echo "🚀 Deploying to Vercel: ${{ steps.parse.outputs.env }}"
          cd target-repo
          
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "❌ VERCEL_TOKEN missing."
            exit 1
          fi
          
          if [ "${{ steps.parse.outputs.env }}" = "production" ]; then
            vercel deploy --prod --token $VERCEL_TOKEN --yes
          else
            vercel deploy --token $VERCEL_TOKEN --yes
          fi

      - name: Notify
        if: always()
        run: |
          echo "📢 Deployment process finished with status: ${{ job.status }}"
