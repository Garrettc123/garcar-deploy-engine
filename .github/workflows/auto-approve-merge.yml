name: Garcar PR Safety Gate

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  safety-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository state
        run: |
          set -euo pipefail
          echo "PR #${{ github.event.pull_request.number }}"
          echo "Head: ${{ github.event.pull_request.head.sha }}"
          echo "Base: ${{ github.event.pull_request.base.sha }}"
          echo "Automatic approval and merge are intentionally disabled for production safety."
