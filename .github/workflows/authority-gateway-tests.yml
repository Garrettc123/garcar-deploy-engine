name: Authority Gateway Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-gateway.txt
      - run: pytest -q tests/test_authority.py
      - name: Validate read-only stack release plan
        run: |
          python -m py_compile scripts/stack_release_preflight.py tests/test_stack_release_preflight.py
          python -m unittest discover -s tests -p 'test_stack_release_preflight.py' -v
          python scripts/stack_release_preflight.py --output /tmp/garcar-stack-plan.json
      - name: Enforce actual GitHub source pins
        run: |
          python scripts/stack_release_preflight.py --verify-github --output /tmp/garcar-stack-pin-evidence.json || { cat /tmp/garcar-stack-pin-evidence.json; exit 2; }
