name: 🏗️ Bootstrap Deploy Engine

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate structure
        run: |
          echo "→ Validating repo structure..."
          for dir in engine registry vault; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing: $dir"
              exit 1
            fi
          done
          echo "✅ Structure valid"
      
      - name: Test secret access
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "✅ Secrets accessible"
          else
            echo "⚠️  No secrets found — add via GitHub Settings"
          fi
      
      - name: Bootstrap complete
        run: |
          echo "════════════════════════════════════════════════════════"
          echo "  ✅ DEPLOY ENGINE READY"
          echo "════════════════════════════════════════════════════════"
          echo ""
          echo "Next: Run 'Garcar Codeless Deploy Engine' workflow"
          echo "Command: Deploy garcar-payments to production"
